# Spike S1 (sonic-rs behaviour) and S5 (dhat accounting semantics). Outside the
# workspace, so the `[workspace]` table below stops cargo's upward walk and the
# versions are spelled out instead of inherited.
[workspace]

[package]
name = "sonic-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[dependencies]
dhat = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
serde_path_to_error = "0.1.20"
sonic-rs = "0.5.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"

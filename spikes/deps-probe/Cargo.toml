# Outside the workspace (root `exclude = ["spikes"]`), so the versions and
# features below are spelled out instead of inherited. The point of this crate
# is its dependency graph: it pulls in the full authorized RUNTIME set so that
# `cargo deny check` reports the transitive license, advisory and duplicate
# situation of the shipping SDK before any SDK code exists. Its binary is a
# link-level smoke test that the set actually composes on the host platform.
# Cargo only treats a package as excluded when it can see this table; the
# root's `exclude` list alone does not stop the upward walk from finding it.
[workspace]

[package]
name = "deps-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[dependencies]
bytes = "1.12.1"
fastrand = "2.5.0"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
hyper = { version = "1.11.1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = [
    "http1",
    "http2",
    "tls12",
    "aws-lc-rs",
] }
hyper-util = { version = "0.1.20", features = [
    "client-legacy",
    "http1",
    "http2",
    "tokio",
] }
rustls = "0.23.45"
rustls-platform-verifier = "0.7.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sonic-rs = "0.5.10"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "time"] }
tower-service = "0.3.3"
tracing = "0.1.44"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"

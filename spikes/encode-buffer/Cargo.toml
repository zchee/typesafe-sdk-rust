# Spike S6: which body-encode buffer strategy survives sonic-rs' worst-case
# string reservation (`len * 6 + 35` before every string write). Outside the
# workspace, so the `[workspace]` table below stops cargo's upward walk.
#
# The binary carries dhat's global allocator and reports blocks and bytes; the
# divan bench is a separate target so that timing is not measured through an
# instrumented allocator. Both use the same `[lib]`, so the variant under
# measurement and the variant under timing are the same code.
[workspace]

[package]
name = "encode-buffer"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[dependencies]
bytes = "1.12.1"
dhat = "0.3.3"
# Spike-only, never enters the workspace: the plan names it as the S6
# exact-size escaper candidate. MIT, 1 required dependency (escape-simd).
json-escape-simd = "3.1.2"
serde = { version = "1.0.229", features = ["derive"] }
sonic-rs = "0.5.10"

[dev-dependencies]
divan = "0.1.21"

[[bench]]
name = "encode"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"

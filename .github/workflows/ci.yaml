name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells nobody anything, so the newest push on a branch
# cancels the ones it replaced. `main` is exempt: its runs are the record of
# what the branch was in, and cancelling one would leave a commit unverified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A test that fails on a runner cannot be re-run under a debugger, so the
  # backtrace has to be in the log the first time.
  RUST_BACKTRACE: 1

jobs:
  # The whole gate, on each supported platform. The steps share one job rather
  # than being split into several because they share a target directory:
  # splitting them would compile the crate once per step instead of once per
  # platform, and buy no parallelism that matters.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one platform is worth seeing beside the other two: whether
      # a break is platform-specific is the first question asked about it.
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, xcode-27, windows-2025]
    steps:
      - uses: actions/checkout@v7

      # `rustup toolchain install` with no toolchain named installs the active
      # one, which is the one rust-toolchain.toml names, together with its
      # components. It is spelled out rather than left to happen on the first
      # cargo call: rustup 1.28.0 removed that automatic install, 1.28.1 put it
      # back as a default that `RUSTUP_AUTO_INSTALL=0` turns off and 1.29.0
      # added `rustup set auto-install disable` beside it, so whether a bare
      # cargo call installs anything is a property of the runner image, not of
      # this workflow. `rustup show` never installed; it only reports.
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-hack,cargo-deny

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The same lints with no features at all. Code reachable only through a
      # feature, or only from tests, is dead in this build, and the run above
      # cannot see that: every feature is on there.
      - name: Lints without default features
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      # The live tests compile here and run nowhere in CI: with a key they
      # make billed calls, without one they fail on purpose. The two steps
      # above already lint them through `--workspace`; naming the package
      # keeps them linted if either step ever drops `--workspace`.
      - name: Lints of the live tests
        run: cargo clippy -p typesafe-sdk-rust-live-tests --all-targets -- -D warnings

      # No `--workspace`: this one runs code. A crate whose tests need a live
      # API key is a workspace member and not a default member, so the default
      # selection is the one that can never reach it.
      - name: Tests
        run: cargo nextest run --all-features

      # The same tests under libtest, which runs the tests of one binary as
      # threads of one process where nextest gives each its own: state that
      # one test leaves in the process (a cached tracing interest, once) can
      # only show here. One platform is enough for a harness difference. No
      # `--workspace`, for the reason given at Tests; the doctests have
      # their own step.
      - name: Tests under libtest
        if: matrix.os == 'ubuntu-26.04'
        run: cargo test --all-features --tests

      - name: Doctests
        run: cargo test --doc --all-features

      # trybuild runs a cargo of its own, which never sees the `--config`
      # flags of the cargo that started the test, so a contributor who moves
      # the target directory with `--config` gets the derive test's other
      # path: it runs itself again with CARGO_TARGET_DIR set to where it was
      # built. The steps above never take that path (trybuild finds the
      # default directory too), so this one does, on each platform, and
      # checks that it did: a re-run prints libtest's header twice. bash on
      # every runner, so the quoting is the same on Windows; the directory is
      # a TOML literal string, whose backslashes stay backslashes.
      - name: The derive's compile-fail cases under a target dir set by --config
        shell: bash
        run: |
          unset CARGO_TARGET_DIR
          log="${RUNNER_TEMP}/trybuild-rerun.log"
          cargo --config "build.target-dir='${RUNNER_TEMP}/target-by-config'" \
            test --all-features --test derive -- misuse --nocapture | tee "${log}"
          test "$(grep -c '^running 1 test' "${log}")" -eq 2

      # Every combination of features, not just none and all: a feature that
      # only compiles because another one happens to be on is a break for the
      # caller who enables it alone. `--no-dev-deps` is what exposes it -
      # a feature a dev-dependency enables hides a missing one in the real
      # dependencies. Clippy rather than check, with warnings denied, so that
      # code dead in one of the combinations between none and all fails too.
      - name: Feature combinations
        run: cargo hack clippy --workspace --feature-powerset --no-dev-deps -- -D warnings

      - name: Dependency policy
        run: cargo deny check

      # A link to an item that is private, renamed or gone still renders; it
      # just renders as text that goes nowhere, which nobody notices in a
      # review. Denying rustdoc's warnings is what turns that into a failure.
      - name: Documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # A task marker, a macro that panics where code should be, or a test
      # switched off with an attribute compiles, passes every lint above and
      # reads as finished in a review. One platform is enough for a scan of
      # the tracked text.
      - name: No placeholders
        if: matrix.os == 'ubuntu-26.04'
        run: python3 .github/scripts/no-placeholders.py

      # The fuzz targets are a workspace of their own, excluded from the one
      # every step above builds, and running them needs nightly. Checking
      # them needs neither: stable compiles them, together with libFuzzer's
      # C++ runtime, so a change to the hidden seam they call through breaks
      # here instead of on the next fuzzing run. One platform is enough for a
      # compile check; `--locked` holds it to the committed lock file.
      - name: Fuzz targets compile
        if: matrix.os == 'ubuntu-26.04'
        run: cargo check --locked --manifest-path fuzz/Cargo.toml

  coverage:
    name: coverage
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update

      # Coverage is the one thing here that needs a component beyond what
      # rust-toolchain.toml installs for everybody, so it is added by the job
      # that needs it rather than by every developer's first build.
      - name: Install the coverage instrumentation
        run: rustup component add llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # The threshold covers the published crates only, each on its own: the
      # test-support server is exercised by the tests that use it, and
      # counting it, or one crate with the other, would let its lines pay for
      # lines that nothing reaches.
      - name: Line coverage
        run: cargo llvm-cov nextest -p typesafe-sdk-rust --all-features --fail-under-lines 85

      # The derive's entry point runs only inside rustc, never under a test
      # harness, so it counts as unreached; everything it calls is measured.
      - name: Line coverage of the derive
        run: cargo llvm-cov nextest -p typesafe-sdk-rust-macros --all-features --fail-under-lines 85

  hygiene:
    name: text hygiene
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # Nothing else in the toolchain looks for these: a NUL byte made git
      # treat a text file as binary once already, and an invisible character
      # survives every formatter this repository runs.
      - name: Invisible and control characters
        run: python3 .github/scripts/text-hygiene.py

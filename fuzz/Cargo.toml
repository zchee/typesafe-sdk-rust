# libFuzzer targets for the two parsers that read bytes a server chose: the
# response decoders and the `Retry-After` parser. The crate has a workspace of
# its own and is excluded from the root one. CI only compiles it and checks
# its dependency policy (`cargo deny --manifest-path fuzz/Cargo.toml check`);
# running a target needs the nightly toolchain and a sanitizer. It is never
# published.
[package]
name = "typesafe-sdk-rust-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
# The root workspace's license, spelled out because this is a workspace of its
# own: `cargo deny` refuses a crate without one, private or not.
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
# `internals` is the seam the targets reach the crate-private decoders
# through; the default features stay on, so a derived answer set is decoded
# too.
typesafe-sdk-rust = { path = "..", features = ["internals"] }
# The same versions the SDK itself resolves, for building its inputs.
bytes = "1.12.1"
http = "1.5.0"

# An empty table makes this directory a workspace root of its own, so cargo
# stops here instead of walking up into the repository's workspace.
[workspace]

[[bin]]
name = "decode_response"
path = "fuzz_targets/decode_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "retry_after"
path = "fuzz_targets/retry_after.rs"
test = false
doc = false
bench = false
